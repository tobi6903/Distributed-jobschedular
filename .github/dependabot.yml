version: 2
updates:
  # Grouped, weekly, and capped: ungrouped Dependabot opened ten pull requests (each running the full
  # pipeline) the moment this repository was created.
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Major versions of Go dependencies are reviewed by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
