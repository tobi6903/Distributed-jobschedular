name: Chaos

# Kills real worker and scheduler processes mid-run and fails if any job is lost or any cron
# slot is missed or duplicated. Nightly, and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: Jobs to process
        default: "20000"

permissions:
  contents: read

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
      - name: Run chaos
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go run ./test/chaos -bin bin -jobs "${{ inputs.jobs || '20000' }}" -kill-every 1s -timeout 10m
