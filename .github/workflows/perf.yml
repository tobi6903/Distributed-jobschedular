name: Load test

# On demand: bring up the Compose stack on the runner and run the k6 load test against it.
on:
  workflow_dispatch:
    inputs:
      rate:
        description: Jobs per second to submit
        default: "300"
      duration:
        description: Test duration
        default: "2m"

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          docker compose -f deploy/docker/docker-compose.yml up --build -d --wait postgres api worker scheduler
          for i in $(seq 60); do curl -fsS localhost:8080/readyz && break; sleep 2; done
      - name: Create an API key
        run: |
          KEY=$(docker compose -f deploy/docker/docker-compose.yml run --rm --no-deps jobctl create-key -tenant ci -name k6)
          echo "::add-mask::$KEY"
          echo "API_KEY=$KEY" >> "$GITHUB_ENV"
      - uses: grafana/setup-k6-action@v1
      - name: k6
        run: k6 run -e API_URL=http://localhost:8080 -e API_KEY="$API_KEY" -e RATE=${{ inputs.rate }} -e DURATION=${{ inputs.duration }} --summary-export=k6-summary.json test/load/k6.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-summary
          path: k6-summary.json
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/docker/docker-compose.yml logs --tail=200
