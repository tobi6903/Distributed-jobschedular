# Prometheus config for the Docker Compose stack. In Kubernetes, scraping is done by the
# ServiceMonitor in the Helm chart instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The application targets are scraped every 5 s (the global default is 15 s): at 15 s, a container that
  # lives less than a scrape interval (for example during a crash storm) is never scraped at all. Use 15 to
  # 30 s in production.
  - job_name: api
    scrape_interval: 5s
    static_configs:
      - targets: ["api:8080"]
  # dns_sd resolves every replica behind the compose service name, so `--scale worker=N` is
  # picked up automatically.
  - job_name: worker
    scrape_interval: 5s
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
  - job_name: scheduler
    scrape_interval: 5s
    dns_sd_configs:
      - names: ["scheduler"]
        type: A
        port: 9101
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
