# Unit tests for the alert and recording rules: synthetic time series go in, and we assert
# exactly which alerts fire. Run with:  promtool test rules deploy/prometheus/tests.yml
rule_files:
  - alerts.yml
  - rules.yml

evaluation_interval: 1m

tests:
  # ---- backlog: oldest ready job age ----
  - name: QueueOldestJobTooOld fires only after 5 sustained minutes
    interval: 1m
    input_series:
      - series: 'jobscheduler_oldest_ready_job_age_seconds{queue="default"}'
        values: "10 10 200x20"       # healthy for 2m, then 200s of waiting
    alert_rule_test:
      - eval_time: 5m                # over the threshold for only 3m so far
        alertname: QueueOldestJobTooOld
        exp_alerts: []
      - eval_time: 10m
        alertname: QueueOldestJobTooOld
        exp_alerts:
          - exp_labels: {severity: warning, queue: default}
            exp_annotations:
              summary: "Queue default: oldest ready job has waited 3m 20s"
              description: "Workers are not keeping up (or are down). Scale workers or investigate."
              runbook_url: "docs/runbooks/queue-backlog.md"
      - eval_time: 10m
        alertname: QueueOldestJobCritical   # 200s is far below the 15 minute critical threshold
        exp_alerts: []

  - name: a healthy queue raises nothing
    interval: 1m
    input_series:
      - series: 'jobscheduler_oldest_ready_job_age_seconds{queue="default"}'
        values: "0x30"
      - series: 'jobscheduler_dlq_size{queue="default"}'
        values: "0x30"
    alert_rule_test:
      - {eval_time: 25m, alertname: QueueOldestJobTooOld, exp_alerts: []}
      - {eval_time: 25m, alertname: DeadLetterQueueNotEmpty, exp_alerts: []}

  # ---- dead-letter queue ----
  - name: DeadLetterQueueNotEmpty fires after 15 minutes
    interval: 1m
    input_series:
      - series: 'jobscheduler_dlq_size{queue="default"}'
        values: "3x30"
    alert_rule_test:
      - {eval_time: 10m, alertname: DeadLetterQueueNotEmpty, exp_alerts: []}
      - eval_time: 20m
        alertname: DeadLetterQueueNotEmpty
        exp_alerts:
          - exp_labels: {severity: warning, queue: default}
            exp_annotations:
              summary: "Queue default has 3 dead jobs"
              description: "Inspect last_error, fix the cause, then replay with POST /jobs/{id}/replay."
              runbook_url: "docs/runbooks/dead-letter-queue.md"

  # ---- retries ----
  - name: HighRetryRate fires when over 20% of attempts are retried
    interval: 1m
    input_series:
      - series: 'jobscheduler_job_retries_total{queue="default",type="email"}'
        values: "0+30x40"            # 30 retries per minute
      - series: 'jobscheduler_job_duration_seconds_count{queue="default",type="email",outcome="succeeded"}'
        values: "0+100x40"           # 100 attempts per minute => 30%
    alert_rule_test:
      - eval_time: 30m
        alertname: HighRetryRate
        exp_alerts:
          - exp_labels: {severity: warning, type: email}
            exp_annotations:
              summary: "Over 20% of email attempts are being retried"
              runbook_url: "docs/runbooks/high-failure-rate.md"

  # ---- crash recovery ----
  - name: WorkerCrashesDetected fires on a single recovery because the counter existed at zero
    interval: 1m
    input_series:
      - series: 'jobscheduler_jobs_reaped_total{result="retried"}'
        values: "0 0 0 5 5 5 5 5"     # created at 0 by the worker at startup, then one reap of 5 jobs
      - series: 'jobscheduler_jobs_reaped_total{result="dead"}'
        values: "0x7"
    alert_rule_test:
      - {eval_time: 2m, alertname: WorkerCrashesDetected, exp_alerts: []}
      - eval_time: 5m
        alertname: WorkerCrashesDetected
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "5 jobs were recovered from expired leases in the last 10m"
              description: "A worker crashed, was OOM-killed, or lost connectivity to Postgres mid-job."
              runbook_url: "docs/runbooks/worker-crashes.md"

  # ---- scheduler leadership ----
  - name: NoSchedulerLeader fires when no replica leads, and a single leader is healthy
    interval: 1m
    input_series:
      - series: 'jobscheduler_scheduler_is_leader{instance="a"}'
        values: "1 1 0x20"           # leader a steps down at t=2m and nobody replaces it
      - series: 'jobscheduler_scheduler_is_leader{instance="b"}'
        values: "0x22"
    alert_rule_test:
      - {eval_time: 1m, alertname: NoSchedulerLeader, exp_alerts: []}
      - {eval_time: 3m, alertname: NoSchedulerLeader, exp_alerts: []}   # down for 1m: under the 2m `for`
      - eval_time: 8m
        alertname: NoSchedulerLeader
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "No scheduler replica holds leadership; cron jobs are not firing"
              runbook_url: "docs/runbooks/scheduler-leader.md"

  - name: MultipleSchedulerLeaders ignores a short failover overlap but catches a sustained one
    interval: 1m
    input_series:
      - series: 'jobscheduler_scheduler_is_leader{instance="a"}'
        values: "1x30"
      - series: 'jobscheduler_scheduler_is_leader{instance="b"}'
        values: "0 0 1 1 0x30"       # overlaps for 2 minutes, then resolves
      - series: 'jobscheduler_scheduler_is_leader{instance="c"}'
        values: "0x12 1x30"          # a sustained second leader from t=12m
    alert_rule_test:
      - {eval_time: 6m, alertname: MultipleSchedulerLeaders, exp_alerts: []}      # the 2m overlap is below the 5m `for`
      - eval_time: 20m
        alertname: MultipleSchedulerLeaders
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "More than one scheduler reports leadership for 5m"
              description: "Brief overlaps during failover are expected. A sustained overlap is a bug or a split brain. Fires stay exactly-once thanks to idempotent keys."
              runbook_url: "docs/runbooks/scheduler-leader.md"

  # ---- backpressure ----
  - name: SubmissionsRejectedByBackpressure fires on sustained 429s
    interval: 1m
    input_series:
      - series: 'jobscheduler_submissions_rejected_total{queue="default",reason="backlog_full"}'
        values: "0+10x40"
    alert_rule_test:
      - {eval_time: 5m, alertname: SubmissionsRejectedByBackpressure, exp_alerts: []}
      - eval_time: 25m
        alertname: SubmissionsRejectedByBackpressure
        exp_alerts:
          - exp_labels: {severity: warning, queue: default}
            exp_annotations:
              summary: "Queue default: submissions have been rejected (429) for 10 minutes"
              description: "A max_backlog limit is being hit continuously. Either producers outrun the workers, or the limit is too low."
              runbook_url: "docs/runbooks/queue-backlog.md"

  # ---- SLO burn rate: the recording rules and the alerts together ----
  - name: pickup SLO fast burn fires when 20 percent of jobs wait over 30s
    interval: 1m
    input_series:
      # Counters: per minute 100 jobs picked up, 80 of them within 30s => 20% bad (budget is 1%, so burn rate 20x).
      - series: 'jobscheduler_job_pickup_latency_seconds_bucket{le="30"}'
        values: "0+80x100"
      - series: 'jobscheduler_job_pickup_latency_seconds_count'
        values: "0+100x100"
    promql_expr_test:
      - expr: round(jobscheduler:pickup_within_30s:ratio_rate5m, 0.01)   # rounded: float noise
        eval_time: 30m
        exp_samples:
          - labels: '{}'
            value: 0.8
    alert_rule_test:
      - eval_time: 80m
        alertname: JobPickupSLOFastBurn
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Job pickup SLO is burning error budget 14x too fast"
              description: "More than 14.4% of jobs waited over 30s to be picked up (1h and 5m windows)."
              runbook_url: "docs/runbooks/queue-backlog.md"

  # The point of multi-window alerting: a short blip must not page. Here the last 5 minutes are
  # 20% bad, so the short window is far over budget, but the hour as a whole is only about 1.7%
  # bad, so the long window stays under the 14.4% threshold and nothing fires.
  - name: a five minute blip does not trigger the fast burn alert
    interval: 1m
    input_series:
      - series: 'jobscheduler_job_pickup_latency_seconds_bucket{le="30"}'
        values: "0+100x55 5500+80x6"       # all good for 55m, then 80% good for 6m
      - series: 'jobscheduler_job_pickup_latency_seconds_count'
        values: "0+100x62"
    alert_rule_test:
      - {eval_time: 60m, alertname: JobPickupSLOFastBurn, exp_alerts: []}

  - name: pickup SLO does not alert when the service meets its objective
    interval: 1m
    input_series:
      # 99.9% within 30s: error ratio 0.1%, a tenth of the 1% budget.
      - series: 'jobscheduler_job_pickup_latency_seconds_bucket{le="30"}'
        values: "0+999x100"
      - series: 'jobscheduler_job_pickup_latency_seconds_count'
        values: "0+1000x100"
    alert_rule_test:
      - {eval_time: 80m, alertname: JobPickupSLOFastBurn, exp_alerts: []}
      - {eval_time: 80m, alertname: JobPickupSLOSlowBurn, exp_alerts: []}

  - name: API availability fast burn fires on a sustained 5xx rate
    interval: 1m
    input_series:
      - series: 'jobscheduler_http_requests_total{code="5xx",route="POST /jobs",method="POST"}'
        values: "0+5x100"            # 5 errors per minute
      - series: 'jobscheduler_http_requests_total{code="2xx",route="POST /jobs",method="POST"}'
        values: "0+95x100"           # of 100 requests => 5% errors vs a 0.1% budget
    alert_rule_test:
      - eval_time: 80m
        alertname: APIAvailabilitySLOFastBurn
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "API 5xx rate is burning the availability budget 14x too fast"
              runbook_url: "docs/runbooks/api-errors.md"
