{{- if not .Values.database.existingSecret }}
{{- $url := .Values.database.url }}
{{- if .Values.postgresql.enabled }}
{{- /* Namespace-qualified: KEDA's operator runs in another namespace and must resolve this host too. */ -}}
{{- $url = printf "postgres://jobs:%s@%s-postgres.%s.svc:5432/jobs?sslmode=disable" .Values.postgresql.password (include "js.fullname" .) .Release.Namespace }}
{{- end }}
{{- if not $url }}
{{- fail "set database.existingSecret (recommended), database.url, or postgresql.enabled=true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "js.secretName" . }}
  labels: {{- include "js.labels" . | nindent 4 }}
  annotations:
    # A pre-install hook so the secret exists before the migration Job (also a pre-install hook).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ $url | quote }}
{{- end }}
