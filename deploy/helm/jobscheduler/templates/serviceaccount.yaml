{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "js.fullname" . }}
  labels: {{- include "js.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The app never talks to the Kubernetes API, so it gets no token.
automountServiceAccountToken: false
{{- end }}
