# Full local stack: Postgres, migrations, API, 2 workers, 2 schedulers, and the observability
# stack (Prometheus, Alertmanager, Grafana, Loki + Promtail, Tempo).
#   make up      then   make key   (prints an API key for tenant "demo")
# Published ports are bound to 127.0.0.1 and can be changed with POSTGRES_PORT, API_PORT,
# PROMETHEUS_PORT, ALERTMANAGER_PORT and GRAFANA_PORT if they clash with something on your machine.
name: jobscheduler

x-app-env: &app-env
  DATABASE_URL: postgres://jobs:jobs@postgres:5432/jobs?sslmode=disable
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  LOG_LEVEL: info

x-build: &build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only, and not 5432: most developers already run a local Postgres on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations, then exits. Everything else waits for it to succeed.
  migrate:
    build: {<<: *build, args: {APP: jobctl}}
    image: jobscheduler/jobctl:dev
    command: ["migrate", "up"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  # `make key` runs: docker compose run --rm jobctl create-key -tenant demo
  jobctl:
    image: jobscheduler/jobctl:dev
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    profiles: ["tools"]

  api:
    build: {<<: *build, args: {APP: api}}
    image: jobscheduler/api:dev
    environment:
      <<: *app-env
      # Every POST /jobs holds a connection for a durable commit, so pool size / commit latency caps API
      # throughput once the database is busy. Measured at 400 req/s while workers drain a large backlog:
      # p95 1,637 ms with 10 connections vs 146 ms with 40 (identical on an idle database).
      # See docs/OPERATIONS.md.
      DB_MAX_CONNS: "${API_DB_MAX_CONNS:-40}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    build: {<<: *build, args: {APP: worker}}
    image: jobscheduler/worker:dev
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: "20"
      WORKER_SHUTDOWN_GRACE: 30s
      # Group "succeeded" writes into one commit (group commit). See docs/OPERATIONS.md "Completion batching".
      WORKER_COMPLETE_BATCH: "${WORKER_COMPLETE_BATCH:-false}"
      WORKER_COMPLETE_BATCH_LINGER: "${WORKER_COMPLETE_BATCH_LINGER:-0s}"
      DB_MAX_CONNS: "${WORKER_DB_MAX_CONNS:-20}"
    deploy:
      replicas: 2
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    # Must exceed WORKER_SHUTDOWN_GRACE so SIGTERM drains instead of SIGKILL cutting jobs off.
    stop_grace_period: 45s

  scheduler:
    build: {<<: *build, args: {APP: scheduler}}
    image: jobscheduler/scheduler:dev
    environment:
      <<: *app-env
      DB_MAX_CONNS: "5"   # the scheduler is light; its leader-election session is one extra connection
    deploy:
      replicas: 2
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - ../prometheus/rules.yml:/etc/prometheus/rules/rules.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ../promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Dashboard screenshots (scripts/grafana-screenshots.sh) are rendered by the optional `renderer`
      # service below. Unused unless that profile is started.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, loki, tempo]

  # Headless Chromium that turns dashboards into PNGs. Opt-in because the image is large:
  #   docker compose --profile render up -d renderer
  renderer:
    image: grafana/grafana-image-renderer:v5.12.11
    profiles: ["render"]
    environment:
      ENABLE_METRICS: "false"
    shm_size: 1gb   # Chromium needs more than Docker's 64 MB default /dev/shm

volumes:
  pgdata:
  lokidata:
  tempodata:
