# Ships container logs from the Docker socket to Loki. Our logs are JSON, so Grafana parses
# fields (job_id, tenant_id, trace_id) at query time with `| json`, and the Loki datasource
# turns trace_id into a link to Tempo.
server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
